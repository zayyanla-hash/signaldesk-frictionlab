# Netlify production hosting config for the static dist/ output.
# SPA fallback lives ONLY in public/_redirects (`/* /index.html 200`), which
# Netlify processes before this file, so no redirects are defined here.
# Verified against the built app: no inline scripts (script-src 'self' is
# enough), React inline style attributes (style-src needs 'unsafe-inline'),
# data-URI favicon only (img-src 'self' data:), no external fetches, forms,
# fonts, frames, or objects (connect-src and form-action are 'none').
# HSTS is left to the host's managed TLS. Not deployed.
[build]
  publish = "dist"
  command = "npm ci && npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
